[package]
name = "anvideck"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
# End-to-end checks only (#242). It opens a WebDriver port that can click anything, Merge
# included, so it is never in a normal build: only `cargo build --features e2e`.
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }

[features]
e2e = ["dep:tauri-plugin-wdio-webdriver"]
